<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - Innovatech PH</title>
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/font-awesome.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .offline-container {
      text-align: center;
      padding: 3rem;
      max-width: 500px;
    }
    .offline-icon {
      font-size: 5rem;
      color: #f59e0b;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    .btn-retry {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border: none;
      padding: 0.75rem 2rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    }
    .queued-data {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <i class="fas fa-wifi"></i>
    </div>
    <div class="status-badge">
      <i class="fas fa-exclamation-triangle me-2"></i>
      You're Offline
    </div>
    <h1 class="h3 mb-3">No Internet Connection</h1>
    <p class="text-muted mb-4">
      You can still view cached content. Your changes will be synced automatically when you reconnect.
    </p>
    <button class="btn btn-retry btn-lg" onclick="checkConnection()">
      <i class="fas fa-sync-alt me-2"></i>
      Try Reconnecting
    </button>
    <div class="queued-data" id="queuedData" style="display: none;">
      <i class="fas fa-clock me-2"></i>
      <span id="queuedCount">0</span> changes queued for sync
    </div>
  </div>

  <script>
    // Check connection status
    function checkConnection() {
      if (navigator.onLine) {
        window.location.href = '/admin/institution/dashboard';
      } else {
        alert('Still offline. Please check your internet connection.');
      }
    }

    // Listen for online/offline events
    window.addEventListener('online', () => {
      console.log('Back online!');
      setTimeout(() => {
        window.location.href = '/admin/institution/dashboard';
      }, 1000);
    });

    window.addEventListener('offline', () => {
      console.log('Gone offline');
    });

    // Load queued data count from IndexedDB
    async function loadQueuedData() {
      try {
        const db = await openDB();
        const tx = db.transaction(['syncQueue'], 'readonly');
        const store = tx.objectStore('syncQueue');
        const count = await store.count();

        if (count > 0) {
          document.getElementById('queuedData').style.display = 'block';
          document.getElementById('queuedCount').textContent = count;
        }
      } catch (error) {
        console.error('Failed to load queued data:', error);
      }
    }

    // Open IndexedDB
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('InnovatechPH', 1);

        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);

        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('syncQueue')) {
            db.createObjectStore('syncQueue', { keyPath: 'id' });
          }
        };
      });
    }

    // Load queued data on page load
    loadQueuedData();
  </script>
</body>
</html>
